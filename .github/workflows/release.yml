name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Signed Release & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tag / Version
        id: version_step
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG_NAME" =~ ^v ]]; then
            VERSION_NAME="${TAG_NAME#v}"
          else
            VERSION_NAME="0.1.0"
            TAG_NAME="v0.1.0"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Building NEXUS Release: $TAG_NAME (Version: $VERSION_NAME)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Make scripts and wrapper executable
        run: |
          chmod +x gradlew || true
          chmod +x scripts/*.sh || true

      - name: Verify Release Signing Secrets
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Release signing configuration is missing. Configure the required GitHub Actions secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) before creating a stable release."
            exit 1
          fi
          echo "Signing secrets detected."

      - name: Decode Keystore File
        run: |
          KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
          mkdir -p "$KEYSTORE_DIR"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_DIR/release.jks"
          echo "KEYSTORE_FILE_PATH=$KEYSTORE_DIR/release.jks" >> $GITHUB_ENV

      - name: Run Test Suite
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint Check
        run: ./gradlew lintDebug --stacktrace

      - name: Build Signed Release APK with Native llama Engine
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_FILE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -PincludeNative=true \
            -PappVersionName="${{ steps.version_step.outputs.version_name }}" \
            --stacktrace

      - name: Package & Rename Artifact
        run: |
          RELEASE_DIR="build-release-artifacts"
          mkdir -p "$RELEASE_DIR"
          ORIGINAL_APK="app/build/outputs/apk/release/app-release.apk"
          TARGET_APK="$RELEASE_DIR/nexus-${{ steps.version_step.outputs.tag_name }}-arm64-v8a-release.apk"
          
          if [ ! -f "$ORIGINAL_APK" ]; then
            echo "ERROR: Generated release APK not found at $ORIGINAL_APK!"
            exit 1
          fi
          
          cp "$ORIGINAL_APK" "$TARGET_APK"
          echo "RELEASE_APK=$TARGET_APK" >> $GITHUB_ENV
          echo "Artifact staged at $TARGET_APK"

      - name: Native Library Verification (arm64-v8a libllama.so)
        run: |
          echo "Verifying native library packaging in ${{ env.RELEASE_APK }}..."
          if ! unzip -l "${{ env.RELEASE_APK }}" | grep -q "lib/arm64-v8a/"; then
            echo "BUILD FAILURE: Expected arm64-v8a native library was not packaged in the release APK."
            unzip -l "${{ env.RELEASE_APK }}" | grep "lib/" || true
            exit 1
          fi
          echo "✓ Native ABI verification succeeded: arm64-v8a libraries confirmed."

      - name: Run Release Verification Script
        run: |
          ./scripts/verify-release.sh "${{ env.RELEASE_APK }}"

      - name: Generate Checksums (SHA-256 & SHA-512)
        run: |
          cd build-release-artifacts
          ../scripts/generate-checksums.sh .
          ls -la

      - name: Generate Release Notes
        id: release_notes
        run: |
          cat << 'EOF' > release_notes.md
          ## NEXUS Automated Release

          ### Verification & Security
          - **Signed Artifact**: Verified with APK Signature Scheme v2/v3.
          - **Native Architecture**: Built and verified for `arm64-v8a` (native C++ llama.cpp inference bridge).
          - **Integrity**: Compare the cryptographic checksums below to verify artifact authenticity.

          ### Checksums
          ```text
          EOF
          cat build-release-artifacts/checksums.sha256 >> release_notes.md
          cat << 'EOF' >> release_notes.md
          ```

          ---
          *Review [CHANGELOG.md](CHANGELOG.md) for full release history.*
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag_name }}
          name: NEXUS ${{ steps.version_step.outputs.tag_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            ${{ env.RELEASE_APK }}
            build-release-artifacts/checksums.sha256
            build-release-artifacts/checksums.sha512

      - name: Cleanup Keystore Memory
        if: always()
        run: |
          if [ -n "${{ env.KEYSTORE_FILE_PATH }}" ] && [ -f "${{ env.KEYSTORE_FILE_PATH }}" ]; then
            shred -u "${{ env.KEYSTORE_FILE_PATH }}" || rm -f "${{ env.KEYSTORE_FILE_PATH }}"
            echo "Sensitive keystore destroyed from runner disk."
          fi
