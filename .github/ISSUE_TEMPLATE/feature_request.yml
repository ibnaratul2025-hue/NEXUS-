name: Feature Request
description: Propose a new capability, tool, adapter, or improvement for NEXUS
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate community ideas! Please describe the proposed functionality and how it adheres to our local-first, safe-by-default, and non-hallucinating architecture.

  - type: dropdown
    id: subsystem
    attributes:
      label: Target Subsystem
      options:
        - "Universal Action Fabric (New tool, action, or system interaction)"
        - "Sandboxed App Adapter (YouTube, GitHub, or custom app adapter)"
        - "Digital World Model (Entities, relationships, or contextual signals)"
        - "JARVIS Operating Layer (Presence, working memory, or missions)"
        - "Cognitive Evolution (Skills, dynamic planning, or learning loop)"
        - "Inference Engine (GGUF, JNI bridge, or quantization formats)"
        - "UI / User Experience (Compose screens, HUD, or theme)"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: Detailed explanation of the requested feature or capability.
    validations:
      required: true

  - type: dropdown
    id: risk_tier
    attributes:
      label: Estimated Risk Level
      options:
        - "LOW (Read-only, non-sensitive)"
        - "MEDIUM (Read-only, sensitive personal data)"
        - "HIGH (Modifies device state or persistent files)"
        - "CRITICAL (Irreversible state modification)"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or workarounds you have considered.
