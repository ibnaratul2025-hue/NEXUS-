name: Bug Report
description: Create a report to help us reproduce and fix a bug in NEXUS
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure you have checked the [Troubleshooting](docs/BUILDING.md) guide before filing.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open NEXUS
        2. Load model '...'
        3. Issue prompt '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: dropdown
    id: device_arch
    attributes:
      label: Device Architecture
      options:
        - "arm64-v8a (Physical Device)"
        - "x86_64 (Emulator)"
        - "Other / Unknown"
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android Version / API Level
      placeholder: "Android 15 (API 35)"
    validations:
      required: true

  - type: input
    id: model_info
    attributes:
      label: GGUF Model & Quantization
      placeholder: "Qwen 2.5 1.5B Instruct (q4_k_m)"

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logcat / Crash Logs
      render: shell
